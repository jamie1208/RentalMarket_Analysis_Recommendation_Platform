<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>租屋推薦 Dashboard</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <!-- ===== Sidebar ===== -->
      <aside class="sidebar">
        <h2 class="logo">租屋平台</h2>

        <nav>
          <a href="/" class="nav-item {{ 'active' if page == 'home' else '' }}">
            租屋推薦
          </a>

          <a
            href="/result"
            class="nav-item {{ 'active' if page == 'result' else '' }}"
          >
            推薦結果
          </a>

          <div class="nav-group">
            <div class="nav-group-title">租屋市場分析</div>

            <a
              href="/analysis/distribution"
              class="nav-sub {{ 'active' if page == 'analysis_distribution' else '' }}"
            >
              租屋市場族群分佈
            </a>

            <a
              href="/analysis/compare"
              class="nav-sub {{ 'active' if page == 'analysis_compare' else '' }}"
            >
              各租屋族群特徵比較
            </a>
          </div>
        </nav>
      </aside>

      <!-- ===== Main Content ===== -->
      <main class="main">
        <div class="content">
          <div class="title-block">
            <h1>你是屬於哪一種租屋族？</h1>
            <p class="subtitle">選擇最符合你的描述，我們會幫你找到相似房源</p>
          </div>

          <div class="card-grid">
            <div class="card" onClick="selectPersona(0)">
              <div class="icon">1</div>
              <div>
                <h3>新婚族／穩定上班族</h3>
                <p>屋齡新、坪數適中，兼顧居住品質與生活舒適度</p>
              </div>
            </div>

            <div class="card" onClick="selectPersona(1)">
              <div class="icon">2</div>
              <div>
                <h3>家庭租屋族</h3>
                <p>大坪數、價格實惠、郊區可接受</p>
              </div>
            </div>

            <div class="card" onClick="selectPersona(2)">
              <div class="icon">3</div>
              <div>
                <h3>豪宅</h3>
                <p>超大坪數與高租金，對應高端居住需求與生活品質</p>
              </div>
            </div>

            <div class="card" onClick="selectPersona(3)">
              <div class="icon">4</div>
              <div>
                <h3>學生/單身上班族</h3>
                <p>租金相對低、坪數較小，適合預算有限且重視地點便利者</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="{{url_for('static',filename='script.js')}}"></script>
  </body>
</html>
